<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ماتور المياه</title>
<style>
:root {
  --bg: #f5f4f0;
  --surface: #ffffff;
  --border: #e2e0d8;
  --border2: #c8c5bb;
  --text: #1a1916;
  --text2: #6b6860;
  --text3: #9e9c96;
  --blue-bg: #e8f0fb;
  --blue-text: #1a4a8a;
  --blue-border: #b8cef0;
  --green-bg: #e6f4ea;
  --green-text: #1a6b35;
  --green-border: #8ecba0;
  --red-bg: #fdecea;
  --red-text: #8b1a1a;
  --amber-bg: #fdf3e3;
  --amber-text: #7a4a0a;
  --amber-border: #e8c97a;
  --gray-bg: #f0eee8;
  --radius: 14px;
  --radius-sm: 9px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ===== LOCK SCREEN ===== */
#lock-screen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; padding: 32px 20px;
}
.lock-icon { font-size: 52px; margin-bottom: 18px; }
.lock-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.lock-sub { font-size: 14px; color: var(--text3); margin-bottom: 28px; }
.lock-input {
  width: 100%; max-width: 320px;
  border: 1.5px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 13px 16px; font-size: 20px; text-align: center;
  background: var(--surface); color: var(--text);
  font-family: inherit; letter-spacing: 6px;
  margin-bottom: 12px;
}
.lock-input:focus { outline: none; border-color: #6b9ee8; }
.btn-login {
  width: 100%; max-width: 320px;
  background: var(--blue-bg); color: var(--blue-text);
  border: 1.5px solid var(--blue-border);
  border-radius: var(--radius-sm); padding: 13px;
  font-size: 16px; font-weight: 700; cursor: pointer;
  font-family: inherit;
}
.btn-login:active { opacity: 0.8; }
.lock-error { color: var(--red-text); font-size: 13px; margin-top: 8px; min-height: 18px; }

/* ===== MAIN APP ===== */
#main-app { display: none; padding-bottom: 40px; }

.topbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 13px 16px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 10;
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.topbar-title { font-size: 17px; font-weight: 700; }
.topbar-price { font-size: 11px; color: var(--text3); background: var(--gray-bg); padding: 3px 8px; border-radius: 20px; }
.topbar-actions { display: flex; gap: 7px; }
.btn-top {
  border-radius: var(--radius-sm); padding: 8px 13px;
  font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  border: 1px solid; white-space: nowrap;
}
.btn-top-blue { background: var(--blue-bg); color: var(--blue-text); border-color: var(--blue-border); }
.btn-top-gray { background: var(--gray-bg); color: var(--text2); border-color: var(--border2); }
.btn-top:active { opacity: 0.8; }

.page { padding: 13px 12px; max-width: 480px; margin: 0 auto; }

.summary-grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px; margin-bottom: 13px;
}
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
.stat-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
.stat-value { font-size: 19px; font-weight: 700; }
.stat-value.red { color: var(--red-text); }
.stat-value.green { color: var(--green-text); }

.backup-bar {
  background: var(--amber-bg); border: 1px solid var(--amber-border);
  border-radius: var(--radius); padding: 10px 13px;
  margin-bottom: 13px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.backup-info { font-size: 12px; color: var(--amber-text); flex: 1; }
.backup-info strong { display: block; font-size: 13px; margin-bottom: 1px; }
.backup-btns { display: flex; gap: 6px; }
.btn-sm {
  border-radius: var(--radius-sm); padding: 7px 11px;
  font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
  border: 1px solid; white-space: nowrap;
}
.btn-sm-amber { background: var(--surface); color: var(--amber-text); border-color: var(--amber-border); }
.btn-sm-amber-fill { background: var(--amber-text); color: #fff; border-color: var(--amber-text); }
.btn-sm:active { opacity: 0.8; }

.section-label {
  font-size: 11px; font-weight: 700; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.6px;
  margin-bottom: 8px; padding-right: 2px;
}

/* ===== CLIENT CARD ===== */
.client-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 10px; overflow: hidden;
}
.client-card.paid-full { border-color: var(--green-border); }
.client-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 13px 10px; border-bottom: 1px solid var(--border); gap: 8px;
}
.client-avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--blue-bg); color: var(--blue-text);
  font-size: 14px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.client-info { flex: 1; min-width: 0; }
.client-name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.client-meta { font-size: 12px; color: var(--text3); margin-top: 2px; }
.mia-badge {
  display: inline-block; background: var(--blue-bg); color: var(--blue-text);
  border-radius: 20px; padding: 2px 8px; font-size: 11px; font-weight: 700;
}
.client-actions { display: flex; gap: 5px; flex-shrink: 0; }
.btn-mia {
  background: var(--blue-bg); color: var(--blue-text);
  border: 1px solid var(--blue-border); border-radius: var(--radius-sm);
  padding: 7px 12px; font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: inherit;
}
.btn-mia:active { opacity: 0.8; }
.btn-icon {
  background: none; border: 1px solid var(--border2);
  border-radius: var(--radius-sm); width: 32px; height: 32px;
  cursor: pointer; color: var(--text3); font-size: 13px;
  display: flex; align-items: center; justify-content: center;
}
.btn-icon:active { background: var(--bg); }

.client-stats {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
}
.cstat {
  padding: 9px 13px; border-bottom: 1px solid var(--border);
  border-left: 1px solid var(--border);
}
.cstat:nth-child(odd) { border-left: none; }
.cstat-label { font-size: 11px; color: var(--text3); margin-bottom: 3px; }
.cstat-value { font-size: 15px; font-weight: 700; }
.cstat-value.red { color: var(--red-text); }
.cstat-value.green { color: var(--green-text); }
.cstat-value.small { font-size: 13px; }

.client-footer { padding: 10px 13px; display: flex; flex-direction: column; gap: 8px; }
.action-row { display: flex; gap: 6px; align-items: center; }
.action-row input {
  flex: 1; border: 1px solid var(--border2); border-radius: var(--radius-sm);
  padding: 8px 10px; font-size: 13px; background: var(--bg); color: var(--text);
  font-family: inherit; direction: rtl;
}
.action-row input:focus { outline: none; border-color: #6b9ee8; }
.btn-green {
  background: var(--green-bg); color: var(--green-text);
  border: 1px solid var(--green-border); border-radius: var(--radius-sm);
  padding: 8px 13px; font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: inherit; white-space: nowrap;
}
.btn-green:active { opacity: 0.8; }
.note-input {
  width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 7px 10px; font-size: 12px; background: var(--bg);
  color: var(--text2); font-family: inherit; direction: rtl;
}
.note-input:focus { outline: none; border-color: var(--border2); }

.empty { text-align: center; padding: 50px 20px; color: var(--text3); }
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-title { font-size: 16px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }

/* ===== MODAL ===== */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.45); z-index: 100;
  align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); border-radius: var(--radius) var(--radius) 0 0;
  padding: 18px 16px 30px; width: 100%; max-width: 480px;
}
.modal-handle {
  width: 36px; height: 4px; background: var(--border2);
  border-radius: 2px; margin: 0 auto 16px;
}
.modal-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
.modal-label { font-size: 13px; color: var(--text2); display: block; margin-bottom: 5px; }
.modal-input {
  width: 100%; border: 1px solid var(--border2); border-radius: var(--radius-sm);
  padding: 10px 12px; font-size: 15px; background: var(--bg);
  color: var(--text); font-family: inherit; direction: rtl; margin-bottom: 11px;
}
.modal-input:focus { outline: none; border-color: #6b9ee8; }
.modal-btns { display: flex; gap: 8px; margin-top: 4px; }
.btn-confirm {
  flex: 1; background: var(--blue-bg); color: var(--blue-text);
  border: 1px solid var(--blue-border); border-radius: var(--radius-sm);
  padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
}
.btn-cancel {
  flex: 1; background: var(--bg); color: var(--text2);
  border: 1px solid var(--border2); border-radius: var(--radius-sm);
  padding: 12px; font-size: 15px; cursor: pointer; font-family: inherit;
}
.btn-confirm:active, .btn-cancel:active { opacity: 0.8; }

/* ===== SETTINGS PANEL ===== */
.settings-panel {
  display: none; background: var(--surface);
  border-bottom: 1px solid var(--border); padding: 14px 16px;
}
.settings-panel.open { display: block; }
.settings-title { font-size: 13px; font-weight: 700; color: var(--text2); margin-bottom: 12px; }
.settings-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.settings-row label { font-size: 13px; color: var(--text2); flex-shrink: 0; min-width: 90px; }
.settings-row input {
  flex: 1; border: 1px solid var(--border2); border-radius: var(--radius-sm);
  padding: 8px 10px; font-size: 14px; background: var(--bg);
  color: var(--text); font-family: inherit; direction: rtl;
}
.settings-row input:focus { outline: none; border-color: #6b9ee8; }
.btn-save-settings {
  background: var(--blue-bg); color: var(--blue-text);
  border: 1px solid var(--blue-border); border-radius: var(--radius-sm);
  padding: 8px 16px; font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: inherit;
}
.btn-save-settings:active { opacity: 0.8; }
.btn-logout {
  background: none; color: var(--text3); border: none;
  font-size: 12px; cursor: pointer; font-family: inherit;
  text-decoration: underline; padding: 4px 0;
}

/* ===== TOAST ===== */
.toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #1a1916; color: #fff;
  padding: 10px 20px; border-radius: 20px;
  font-size: 13px; font-weight: 500; z-index: 200;
  transition: transform 0.3s ease; white-space: nowrap; pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lock-screen">
  <div class="lock-icon">🔒</div>
  <div class="lock-title">ماتور المياه</div>
  <div class="lock-sub">ادخل كلمة المرور للدخول</div>
  <input class="lock-input" id="lock-input" type="password" placeholder="••••" maxlength="20"
    onkeydown="if(event.key==='Enter') doLogin()" />
  <button class="btn-login" onclick="doLogin()">دخول</button>
  <div class="lock-error" id="lock-error"></div>
</div>

<!-- MAIN APP -->
<div id="main-app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-title">ماتور المياه</div>
      <div class="topbar-price" id="price-badge">200 ج/فدان/مية</div>
    </div>
    <div class="topbar-actions">
      <button class="btn-top btn-top-gray" onclick="toggleSettings()">⚙ إعدادات</button>
      <button class="btn-top btn-top-blue" onclick="openAddModal()">+ عميل</button>
    </div>
  </div>

  <!-- SETTINGS PANEL -->
  <div class="settings-panel" id="settings-panel">
    <div class="settings-title">الإعدادات</div>
    <div class="settings-row">
      <label>سعر المية</label>
      <input type="number" id="set-price" placeholder="جنيه لكل فدان لكل مية" min="1" step="1" />
      <span style="font-size:12px;color:var(--text3);white-space:nowrap">ج/فدان</span>
    </div>
    <div class="settings-row">
      <label>كلمة المرور</label>
      <input type="password" id="set-pass" placeholder="كلمة المرور الجديدة" />
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:4px">
      <button class="btn-save-settings" onclick="saveSettings()">حفظ الإعدادات</button>
      <button class="btn-logout" onclick="doLogout()">تسجيل خروج</button>
    </div>
  </div>

  <div class="page">
    <div class="summary-grid" id="summary-grid"></div>

    <div class="backup-bar">
      <div class="backup-info">
        <strong>النسخ الاحتياطي</strong>
        <span id="last-save-label">احفظ ملف بعد كل تغيير مهم</span>
      </div>
      <div class="backup-btns">
        <button class="btn-sm btn-sm-amber" onclick="doBackup()">حفظ ملف</button>
        <button class="btn-sm btn-sm-amber-fill" onclick="triggerRestore()">استعادة</button>
      </div>
    </div>
    <input type="file" id="restore-input" accept=".json" style="display:none" onchange="doRestore(event)">

    <div class="section-label">العملاء</div>
    <div id="clients-list"></div>
  </div>
</div>

<!-- ADD CLIENT MODAL -->
<div class="modal-overlay" id="add-modal" onclick="handleOverlay(event,'add-modal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">إضافة عميل جديد</div>
    <label class="modal-label">اسم العميل</label>
    <input class="modal-input" id="inp-name" type="text" placeholder="مثال: محمد أحمد" />
    <label class="modal-label">مساحة الأرض (فدان)</label>
    <input class="modal-input" id="inp-feddans" type="number" placeholder="مثال: 3.5" min="0.25" step="0.25" />
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('add-modal')">إلغاء</button>
      <button class="btn-confirm" onclick="addClient()">إضافة</button>
    </div>
  </div>
</div>

<!-- EDIT CLIENT MODAL -->
<div class="modal-overlay" id="edit-modal" onclick="handleOverlay(event,'edit-modal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">تعديل بيانات العميل</div>
    <input type="hidden" id="edit-idx" />
    <label class="modal-label">اسم العميل</label>
    <input class="modal-input" id="edit-name" type="text" />
    <label class="modal-label">مساحة الأرض (فدان)</label>
    <input class="modal-input" id="edit-feddans" type="number" min="0.25" step="0.25" />
    <label class="modal-label">عدد الميات (التعديل المباشر)</label>
    <input class="modal-input" id="edit-miaat" type="number" min="0" step="1" />
    <label class="modal-label">إجمالي الواصل (التعديل المباشر)</label>
    <input class="modal-input" id="edit-wasil" type="number" min="0" step="1" />
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('edit-modal')">إلغاء</button>
      <button class="btn-confirm" onclick="saveEdit()">حفظ التعديل</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'mator_v3';
const SETTINGS_KEY = 'mator_settings_v3';

let clients = [];
let settings = { price: 200, password: '1234' };
let settingsOpen = false;

// ===== INIT =====
function init() {
  loadSettings();
  loadData();
  document.getElementById('lock-input').focus();
}

function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) settings = { ...settings, ...JSON.parse(raw) };
  } catch(e) {}
}

function saveSettings_() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch(e) {}
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (Array.isArray(p)) clients = p;
    }
  } catch(e) { clients = []; }
}

function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(clients)); } catch(e) {
    showToast('تحذير: فشل الحفظ التلقائي!');
  }
}

// ===== AUTH =====
function doLogin() {
  const val = document.getElementById('lock-input').value;
  if (val === settings.password) {
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';
    document.getElementById('lock-error').textContent = '';
    render();
  } else {
    document.getElementById('lock-error').textContent = 'كلمة المرور غلط، حاول تاني';
    document.getElementById('lock-input').value = '';
    document.getElementById('lock-input').focus();
  }
}

function doLogout() {
  document.getElementById('main-app').style.display = 'none';
  document.getElementById('lock-screen').style.display = 'flex';
  document.getElementById('lock-input').value = '';
  settingsOpen = false;
  document.getElementById('settings-panel').classList.remove('open');
  showToast('تم تسجيل الخروج');
}

// ===== SETTINGS =====
function toggleSettings() {
  settingsOpen = !settingsOpen;
  const panel = document.getElementById('settings-panel');
  if (settingsOpen) {
    panel.classList.add('open');
    document.getElementById('set-price').value = settings.price;
    document.getElementById('set-pass').value = '';
  } else {
    panel.classList.remove('open');
  }
}

function saveSettings() {
  const priceVal = parseFloat(document.getElementById('set-price').value);
  const passVal = document.getElementById('set-pass').value.trim();
  if (priceVal && priceVal > 0) settings.price = priceVal;
  if (passVal.length >= 4) settings.password = passVal;
  else if (passVal.length > 0 && passVal.length < 4) {
    showToast('كلمة المرور لازم تكون 4 أحرف على الأقل'); return;
  }
  saveSettings_();
  render();
  toggleSettings();
  showToast('تم حفظ الإعدادات');
}

// ===== CALC =====
function calcDue(c) { return Math.round(c.miaat * c.feddans * settings.price); }
function calcRem(c) { return calcDue(c) - Math.round(c.wasil); }

function getInitials(name) {
  const p = name.trim().split(' ');
  return p.length >= 2 ? p[0][0] + p[1][0] : name.slice(0,2);
}
function fmt(n) { return Math.round(n).toLocaleString('ar-EG'); }
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ===== RENDER =====
function render() {
  document.getElementById('price-badge').textContent = fmt(settings.price) + ' ج/فدان/مية';
  renderSummary();
  renderClients();
}

function renderSummary() {
  const g = document.getElementById('summary-grid');
  if (!clients.length) { g.innerHTML = ''; return; }
  const totalDue = clients.reduce((a,c) => a + calcDue(c), 0);
  const totalPaid = clients.reduce((a,c) => a + Math.round(c.wasil), 0);
  const totalRem = totalDue - totalPaid;
  g.innerHTML = `
    <div class="stat"><div class="stat-label">إجمالي المستحق</div><div class="stat-value">${fmt(totalDue)} ج</div></div>
    <div class="stat"><div class="stat-label">إجمالي الواصل</div><div class="stat-value green">${fmt(totalPaid)} ج</div></div>
    <div class="stat"><div class="stat-label">إجمالي المتبقي</div><div class="stat-value ${totalRem>0?'red':'green'}">${fmt(totalRem)} ج</div></div>
    <div class="stat"><div class="stat-label">عدد العملاء</div><div class="stat-value">${clients.length}</div></div>
  `;
}

function renderClients() {
  const list = document.getElementById('clients-list');
  if (!clients.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">🌾</div><div class="empty-title">لا يوجد عملاء بعد</div><div style="font-size:13px;color:var(--text3)">اضغط "+ عميل" لإضافة أول عميل</div></div>`;
    return;
  }
  list.innerHTML = clients.map((c,i) => {
    const due = calcDue(c);
    const rem = calcRem(c);
    const full = rem <= 0;
    return `
    <div class="client-card ${full?'paid-full':''}">
      <div class="client-header">
        <div class="client-avatar">${escHtml(getInitials(c.name))}</div>
        <div class="client-info">
          <div class="client-name">${escHtml(c.name)}</div>
          <div class="client-meta">${c.feddans} فدان &nbsp;·&nbsp; <span class="mia-badge">${c.miaat} مية</span></div>
        </div>
        <div class="client-actions">
          <button class="btn-mia" onclick="addMia(${i})">+ مية</button>
          <button class="btn-icon" onclick="openEdit(${i})" title="تعديل">✎</button>
          <button class="btn-icon" onclick="confirmDelete(${i})" title="حذف">✕</button>
        </div>
      </div>
      <div class="client-stats">
        <div class="cstat"><div class="cstat-label">المستحق</div><div class="cstat-value">${fmt(due)} ج</div></div>
        <div class="cstat"><div class="cstat-label">الواصل</div><div class="cstat-value green">${fmt(c.wasil)} ج</div></div>
        <div class="cstat" style="border-bottom:none"><div class="cstat-label">المتبقي</div><div class="cstat-value ${rem>0?'red':'green'}">${fmt(rem)} ج</div></div>
        <div class="cstat" style="border-bottom:none"><div class="cstat-label">الحالة</div><div class="cstat-value small ${full?'green':'red'}">${full?'مسدد بالكامل':'عليه مبلغ'}</div></div>
      </div>
      <div class="client-footer">
        <div class="action-row">
          <input type="number" id="pay-${i}" placeholder="أضف مبلغ واصل (جنيه)" min="1" step="1" />
          <button class="btn-green" onclick="addPayment(${i})">سجّل دفع</button>
        </div>
        <input class="note-input" type="text" id="note-${i}" placeholder="ملاحظة..." value="${escHtml(c.note||'')}" onchange="updateNote(${i},this.value)" />
      </div>
    </div>`;
  }).join('');
}

// ===== CLIENT ACTIONS =====
function addMia(i) {
  clients[i].miaat++;
  saveData(); render();
  showToast('تمت إضافة مية لـ ' + clients[i].name);
}



function addPayment(i) {
  const inp = document.getElementById('pay-'+i);
  const val = parseFloat(inp.value);
  if (!val || val <= 0) { showToast('ادخل مبلغ صحيح'); return; }
  clients[i].wasil = Math.round(clients[i].wasil + val);
  saveData(); render();
  showToast('تم تسجيل ' + fmt(val) + ' ج لـ ' + clients[i].name);
}

function updateNote(i, val) {
  clients[i].note = val;
  saveData();
}

function confirmDelete(i) {
  if (confirm('هتحذف ' + clients[i].name + '؟\nالبيانات مش هترجع!')) {
    const name = clients[i].name;
    clients.splice(i, 1);
    saveData(); render();
    showToast('تم حذف ' + name);
  }
}

// ===== ADD CLIENT =====
function openAddModal() { openModal('add-modal'); setTimeout(()=>document.getElementById('inp-name').focus(),100); }

function addClient() {
  const name = document.getElementById('inp-name').value.trim();
  const feddans = parseFloat(document.getElementById('inp-feddans').value);
  if (!name) { showToast('ادخل اسم العميل'); return; }
  if (!feddans || feddans <= 0) { showToast('ادخل مساحة الأرض'); return; }
  clients.push({ name, feddans, miaat: 0, wasil: 0, note: '' });
  saveData();
  closeModal('add-modal');
  document.getElementById('inp-name').value = '';
  document.getElementById('inp-feddans').value = '';
  render();
  showToast('تمت إضافة ' + name);
}

// ===== EDIT CLIENT =====
function openEdit(i) {
  const c = clients[i];
  document.getElementById('edit-idx').value = i;
  document.getElementById('edit-name').value = c.name;
  document.getElementById('edit-feddans').value = c.feddans;
  document.getElementById('edit-miaat').value = c.miaat;
  document.getElementById('edit-wasil').value = Math.round(c.wasil);
  openModal('edit-modal');
  setTimeout(()=>document.getElementById('edit-name').focus(),100);
}

function saveEdit() {
  const i = parseInt(document.getElementById('edit-idx').value);
  const name = document.getElementById('edit-name').value.trim();
  const feddans = parseFloat(document.getElementById('edit-feddans').value);
  const miaat = parseInt(document.getElementById('edit-miaat').value);
  const wasil = parseFloat(document.getElementById('edit-wasil').value);
  if (!name) { showToast('ادخل اسم العميل'); return; }
  if (!feddans || feddans <= 0) { showToast('ادخل مساحة صحيحة'); return; }
  if (isNaN(miaat) || miaat < 0) { showToast('عدد الميات لازم يكون صحيح'); return; }
  if (isNaN(wasil) || wasil < 0) { showToast('الواصل لازم يكون صحيح'); return; }
  clients[i] = { ...clients[i], name, feddans, miaat, wasil: Math.round(wasil) };
  saveData(); closeModal('edit-modal'); render();
  showToast('تم تعديل بيانات ' + name);
}

// ===== MODAL HELPERS =====
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function handleOverlay(e, id) { if (e.target === document.getElementById(id)) closeModal(id); }

// ===== BACKUP / RESTORE =====
function doBackup() {
  const data = { version: 3, date: new Date().toISOString(), clients, settings };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const now = new Date();
  const ds = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  a.href = url; a.download = 'mator-almiyah-' + ds + '.json';
  a.click(); URL.revokeObjectURL(url);
  document.getElementById('last-save-label').textContent = 'آخر نسخة: ' + now.toLocaleTimeString('ar-EG');
  showToast('تم حفظ النسخة الاحتياطية ✓');
}

function triggerRestore() {
  if (clients.length > 0 && !confirm('استعادة النسخة هتمسح البيانات الحالية. متأكد؟')) return;
  document.getElementById('restore-input').click();
}

function doRestore(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data.clients && Array.isArray(data.clients)) {
        clients = data.clients;
        if (data.settings) { settings = { ...settings, ...data.settings }; saveSettings_(); }
        saveData(); render();
        showToast('تمت الاستعادة - ' + clients.length + ' عملاء ✓');
      } else { showToast('الملف غير صحيح'); }
    } catch(err) { showToast('خطأ في قراءة الملف'); }
    event.target.value = '';
  };
  reader.readAsText(file);
}

// ===== TOAST =====
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2800);
}

// ===== START =====
init();
</script>
